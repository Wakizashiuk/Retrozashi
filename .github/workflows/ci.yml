name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]          # a version tag also publishes a GitHub Release (job "release" below)
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Windows" ]; then
            pip install -e ".[dev,uia]"
          else
            pip install -e ".[dev]"
          fi
      - name: Test
        env:
          PYTHONFAULTHANDLER: "1"   # if the interpreter ever crashes (e.g. at shutdown), print where
        run: python -m pytest -v

  build-exe:
    name: Build Retrozashi.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and self-test
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Retrozashi-win64
          path: dist/Retrozashi-win64.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-report
          path: dist/selftest.json
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Retrozashi-win64
      - name: Create release with the exe
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip="Retrozashi-${TAG}-win64.zip"
          mv Retrozashi-win64.zip "$zip"
          sha256sum "$zip" > "$zip.sha256"
          notes="docs/releases/${TAG}.md"
          [ -f "$notes" ] || notes=docs/releases/default.md
          # v0.x and tags with a suffix (v1.0.0-rc1) are marked as pre-releases.
          pre=""
          if [[ "$TAG" == v0.* || "$TAG" == *-* ]]; then pre="--prerelease"; fi
          gh release create "$TAG" "$zip" "$zip.sha256" --repo "$GITHUB_REPOSITORY" \
            --title "Retrozashi $TAG" --notes-file "$notes" --verify-tag $pre
