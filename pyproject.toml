[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrozashi"
version = "0.2.1"
description = "Voice + chat AI agent that configures and controls Windows emulators via config files and Claude Computer Use."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "PySide6>=6.7",
    "mss>=9.0",
    "Pillow>=10.0",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.26",
]
uia = ["pywinauto>=0.6.8"]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
retrozashi = "retrozashi.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retrozashi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
